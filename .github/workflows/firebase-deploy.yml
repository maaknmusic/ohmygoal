# Optional: automatically publish the website, firestore.rules and the Cloud Functions when main changes.
# Does nothing until you add a repository secret FIREBASE_SERVICE_ACCOUNT (see README → "Automatic deploys").
# Razorpay keys are NOT stored here: set them once with deploy.sh (they live in Google Secret Manager).
name: Deploy Firebase (website, rules, functions)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: firebase-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check credentials
        id: creds
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then
            echo "::notice::FIREBASE_SERVICE_ACCOUNT secret not set; skipping deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
          fi
      - name: Deploy functions (first: the new rules need the access passes only they issue)
        if: steps.creds.outputs.skip != 'true'
        run: |
          npm ci --prefix functions --no-audit --no-fund
          npx --yes firebase-tools@15.32.1 deploy --only functions --project ohmygoal-c8a4a --non-interactive --force
      - name: Publish security rules
        if: steps.creds.outputs.skip != 'true'
        run: npx --yes firebase-tools@15.32.1 deploy --only firestore:rules --project ohmygoal-c8a4a --non-interactive
      - name: Deploy website (Firebase Hosting)
        if: steps.creds.outputs.skip != 'true'
        run: npx --yes firebase-tools@15.32.1 deploy --only hosting --project ohmygoal-c8a4a --non-interactive
